# Base Nginx configuration for the Agoreum droplet.
#
# Sized for 2 vCPUs. Everything here is about the reverse proxy's own behaviour;
# per-site routing lives in conf.d/default.conf.

user nginx;
# One worker per core. More would contend for the same CPUs.
worker_processes auto;
worker_rlimit_nofile 8192;

error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 2048;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Cloudflare sits in front, so the socket peer is a Cloudflare edge and
    # logging it raw would make every request look like one of a handful of
    # addresses. cloudflare_realip.conf resolves $remote_addr to the true visitor
    # for connections that come from a Cloudflare range, so it is now both the
    # real address and a trusted one. The previous $http_cf_connecting_ip was
    # whatever the client sent, so a request straight to the origin could write
    # any address it liked into these logs.
    log_format json escape=json '{'
        '"time":"$time_iso8601",'
        '"client_ip":"$remote_addr",'
        '"method":"$request_method",'
        '"path":"$uri",'
        '"status":$status,'
        '"bytes":$body_bytes_sent,'
        '"duration_ms":$request_time,'
        '"upstream_ms":"$upstream_response_time",'
        '"request_id":"$http_x_request_id",'
        '"user_agent":"$http_user_agent"'
    '}';

    access_log /var/log/nginx/access.log json;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;

    keepalive_timeout 65;
    keepalive_requests 1000;

    # Slow-request defences. A client that opens a connection and dribbles bytes
    # ties up a worker; these bound how long it can.
    client_body_timeout 12s;
    client_header_timeout 12s;
    send_timeout 30s;
    reset_timedout_connection on;

    # Mirrors the API's own 1 MiB ceiling, refusing oversized bodies at the edge
    # before they reach an application worker at all.
    client_max_body_size 1m;
    client_body_buffer_size 128k;
    large_client_header_buffers 4 16k;

    # Nginx's version is not information a visitor needs.
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_types
        application/javascript
        application/json
        application/manifest+json
        application/xml
        image/svg+xml
        text/css
        text/plain
        text/xml;

    # Rate limiting at the edge, in front of the application's own limiter.
    # This one is per-IP and cheap; the application's is per-identity and
    # understands who is calling. Both exist because they catch different abuse.
    limit_req_zone $binary_remote_addr zone=general:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=auth:10m rate=2r/s;
    limit_req_status 429;
    limit_conn_zone $binary_remote_addr zone=connections:10m;
    limit_conn_status 429;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_buffering on;
    proxy_buffer_size 8k;
    proxy_buffers 16 8k;

    include /etc/nginx/conf.d/*.conf;
}

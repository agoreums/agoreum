# Cloudflare edge addresses, and the real client IP behind them.
#
# Without this block nginx has no idea which peers are Cloudflare, which undoes
# two protections the stack is assumed to have.
#
# First, CF-Connecting-IP was forwarded straight from the client
# ($http_cf_connecting_ip). That header is unforgeable only for traffic that
# actually transits Cloudflare, because Cloudflare overwrites it. Anyone reaching
# the origin address directly could set it to any value, and the API trusts it as
# the client identity, so every per-IP rate limit could be bypassed by rotating a
# made-up address and every recorded session IP could be attacker chosen.
#
# Second, both limit_req_zone keys use $binary_remote_addr, which behind
# Cloudflare is the edge node rather than the visitor. Those buckets were shared
# by everyone routed through the same edge, so one attacker received far more
# than the intended rate while unrelated users could be throttled by a stranger.
#
# set_real_ip_from names the peers allowed to speak for someone else. Only when
# the connection genuinely comes from one of these does nginx replace
# $remote_addr with the CF-Connecting-IP value. A direct connection keeps its own
# peer address, so a forged header is ignored. That repairs the limit zone keys
# at the same time, because $binary_remote_addr becomes the real visitor.
#
# real_ip_recursive is off deliberately: CF-Connecting-IP carries exactly one
# address, so there is no chain to walk, and walking one would let a client
# prepend entries.
#
# Regenerate with scripts/update_cloudflare_ips.sh when Cloudflare publishes
# changes. Sourced from cloudflare.com/ips-v4 and cloudflare.com/ips-v6.

# IPv4
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;

# IPv6
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;

real_ip_header CF-Connecting-IP;
real_ip_recursive off;

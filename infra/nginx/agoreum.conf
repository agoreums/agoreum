# Site configuration for agoreum.xyz.
#
# Cloudflare terminates TLS at the edge and connects here over TLS again, using
# a Cloudflare Origin certificate. That means traffic is encrypted end to end
# rather than travelling in clear between the edge and the droplet, which would
# leave it readable to anything on the path inside the datacentre.

# Upstreams are named so a failing container is retried rather than 502ing on
# the first attempt during a deploy.
upstream agoreum_api {
    server api:8000 max_fails=3 fail_timeout=15s;
    keepalive 32;
}

upstream agoreum_web {
    server web:3000 max_fails=3 fail_timeout=15s;
    keepalive 32;
}

# Self-hosted Umami analytics, served under /insights so the tracker and its
# collection endpoint are same-origin — no third-party script origin, so the CSP
# stays 'self' and no cross-site request is ever made.
upstream agoreum_umami {
    server umami:3000 max_fails=3 fail_timeout=15s;
    keepalive 16;
}

# Everything on port 80 is redirected. The only exception is the load-balancer
# health check, which must not depend on TLS being correctly configured.
server {
    listen 80 default_server;
    server_name _;

    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain always;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl default_server;
    http2 on;
    server_name agoreum.xyz www.agoreum.xyz;

    ssl_certificate     /etc/nginx/certs/origin.pem;
    ssl_certificate_key /etc/nginx/certs/origin.key;

    # TLS 1.2 is retained for older wallets' embedded browsers; everything below
    # it is refused outright.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # HSTS is set here as well as by the application, so it still applies to
    # responses Nginx produces itself (redirects, error pages, rate-limit 429s).
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    limit_conn connections 50;

    # www redirects to the apex so there is one canonical origin. Two live
    # hostnames would split SEO and break the SIWE domain check, which compares
    # against exactly one host.
    if ($host = www.agoreum.xyz) {
        return 301 https://agoreum.xyz$request_uri;
    }

    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain always;
    }

    # --- API ----------------------------------------------------------------

    location /api/ {
        limit_req zone=general burst=60 nodelay;

        proxy_pass http://agoreum_api;
        include /etc/nginx/conf.d/proxy_headers.conf;

        # Long enough for a chain read that has to wait on an RPC provider,
        # short enough that a hung upstream does not tie up workers.
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    # Authentication is the endpoint an attacker hammers, so it gets a far
    # tighter edge budget than the rest of the API.
    location ~ ^/api/v1/auth/(nonce|signin|refresh)$ {
        limit_req zone=auth burst=10 nodelay;

        proxy_pass http://agoreum_api;
        include /etc/nginx/conf.d/proxy_headers.conf;

        proxy_connect_timeout 5s;
        proxy_read_timeout 20s;
    }

    # Interactive docs are disabled in the application when APP_ENV=production;
    # blocked here too so a misconfiguration cannot expose them.
    location ~ ^/(docs|redoc|openapi\.json)$ {
        return 404;
    }

    # --- Analytics (self-hosted Umami, same-origin) -------------------------
    location /insights/ {
        proxy_pass http://agoreum_umami;
        include /etc/nginx/conf.d/proxy_headers.conf;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        access_log off;
    }

    # --- Web ----------------------------------------------------------------

    # Next's build output is content-hashed, so it can be cached indefinitely
    # and safely: a changed file gets a different URL.
    location /_next/static/ {
        proxy_pass http://agoreum_web;
        include /etc/nginx/conf.d/proxy_headers.conf;
        proxy_cache_valid 200 365d;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
    }

    location ~* ^/(favicon\.ico|site\.webmanifest|robots\.txt|icons/) {
        proxy_pass http://agoreum_web;
        include /etc/nginx/conf.d/proxy_headers.conf;
        add_header Cache-Control "public, max-age=86400" always;
        access_log off;
    }

    location / {
        limit_req zone=general burst=60 nodelay;

        proxy_pass http://agoreum_web;
        include /etc/nginx/conf.d/proxy_headers.conf;

        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    # Application error pages, not Nginx's, so a failure looks like part of the
    # product rather than a bare server message.
    proxy_intercept_errors off;
}

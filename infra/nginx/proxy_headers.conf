# Headers passed to every upstream.
#
# CF-Connecting-IP is set by Cloudflare and is the only client address the
# application trusts. It is forwarded verbatim; a client cannot forge it,
# because Cloudflare overwrites whatever the client sent.
proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host  $host;
proxy_set_header CF-Connecting-IP  $http_cf_connecting_ip;

# Correlates a request across Nginx, the API and its logs. Generated here when
# the client did not supply one; the application validates it as a UUID and
# replaces anything malformed, so this cannot be used to inject into logs.
proxy_set_header X-Request-ID      $http_x_request_id;

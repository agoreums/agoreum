# Headers passed to every upstream.
#
# CF-Connecting-IP is the only client address the application trusts, so it must
# be one nginx vouches for rather than one the client chose. It used to be
# forwarded verbatim as $http_cf_connecting_ip, on the reasoning that Cloudflare
# overwrites whatever the client sent. That is true only of traffic that reaches
# us through Cloudflare. A request made straight to the origin address carries
# whatever header its sender likes, which made the value forgeable and every
# per-IP limit and recorded session address along with it.
#
# $remote_addr is now the safe source. cloudflare_realip.conf sets it from
# CF-Connecting-IP only when the connection actually comes from a Cloudflare
# range, and otherwise leaves it as the true peer, so this line forwards a
# trusted address in both cases and a forged header is discarded.
proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host  $host;
proxy_set_header CF-Connecting-IP  $remote_addr;

# Correlates a request across Nginx, the API and its logs. Generated here when
# the client did not supply one; the application validates it as a UUID and
# replaces anything malformed, so this cannot be used to inject into logs.
proxy_set_header X-Request-ID      $http_x_request_id;

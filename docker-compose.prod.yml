# Production stack for the DigitalOcean droplet.
#
# Target: Ubuntu 24.04, 4 GB RAM, 2 vCPU, 120 GB disk.
#
# Two decisions follow from that sizing:
#
# * PostgreSQL is **not** in this file. Production uses DigitalOcean's managed
#   database, so a droplet rebuild cannot take the data with it, and backups and
#   failover are somebody else's full-time job rather than an afterthought.
# * Memory limits are set explicitly. On a 4 GB box an unbounded container can
#   push the others into the OOM killer, and the process that dies is whichever
#   happened to allocate last rather than the one at fault.
#
# TLS terminates at Cloudflare and again at Nginx; certificates are mounted in
# rather than baked into any image.
#
# Usage:
#   docker compose -f docker-compose.prod.yml up -d --build

name: agoreum

services:
  redis:
    image: redis:7-alpine
    restart: always
    # Rate-limit counters and cache entries only, nothing here needs to survive
    # a restart, and persistence would only add disk churn.
    command: >
      redis-server
      --save ""
      --appendonly no
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
    # Never published to the host: only the API talks to it, over the internal
    # network. Exposing Redis on a public interface is how boxes get mined.
    expose:
      - "6379"
    networks:
      - internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 640M
    logging: &logging
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: always
    depends_on:
      redis:
        condition: service_healthy
    env_file:
      # Every secret comes from this file at runtime. Nothing is baked into an
      # image, so an image leak is not a credential leak.
      - .env
    environment:
      APP_ENV: production
      DEBUG: "false"
      REDIS_URL: redis://redis:6379/0
      RATE_LIMIT_ENABLED: "true"
      # The image flattens the source tree, so the repo-relative ABI path does
      # not hold here, point at where the Dockerfile actually places it.
      CONTRACT_ABI_PATH: /srv/packages/contracts/AgoreumEscrow.abi.json
    expose:
      - "8000"
    networks:
      - internal
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/api/v1/health/ready"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    # Two workers for two vCPUs. More would contend for the same cores while
    # multiplying the database connection pool.
    command: >
      uvicorn app.main:app --host 0.0.0.0 --port 8000
      --workers 2 --proxy-headers --forwarded-allow-ips "*" --no-server-header
    deploy:
      resources:
        limits:
          memory: 1G
    logging: *logging

  # The indexer is the only thing that may mark an order funded or completed.
  # It runs as its own service rather than inside the API for two reasons: it
  # must keep running while the API is being redeployed, and the API runs two
  # workers, which would otherwise both scan the same range.
  #
  # It reuses the API image, same code, different entrypoint, so there is no
  # second build and no chance of the two drifting apart.
  #
  # If this container is not running, buyers can fund escrows and nothing will
  # ever credit their orders. Alert on its absence, not just on its errors.
  indexer:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: always
    depends_on:
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      APP_ENV: production
      DEBUG: "false"
      REDIS_URL: redis://redis:6379/0
      CONTRACT_ABI_PATH: /srv/packages/contracts/AgoreumEscrow.abi.json
    networks:
      - internal
    # The indexer reuses the API image, which carries an HTTP healthcheck. This
    # process has no HTTP port, so that check would always fail and mark a
    # perfectly healthy indexer unhealthy. Disable it; liveness is the restart
    # policy, and progress is the chain_scan_complete log line (alert on its
    # absence, per deployment.md).
    healthcheck:
      disable: true
    command: >
      python -m app.cli index-chain --follow --interval 15
    deploy:
      resources:
        limits:
          memory: 384M
    logging: *logging

  # Subscription indexer. The same shape as the escrow indexer, against the
  # subscription contract: it alone may activate a subscription, and only from a
  # confirmed on-chain payment. Idle and harmless until SUBSCRIPTIONS_CONTRACT_ADDRESS
  # is set, at which point it begins projecting subscription state from the chain.
  subscriptions-indexer:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: always
    depends_on:
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      APP_ENV: production
      DEBUG: "false"
      REDIS_URL: redis://redis:6379/0
      CONTRACT_ABI_PATH: /srv/packages/contracts/AgoreumEscrow.abi.json
      SUBSCRIPTIONS_ABI_PATH: /srv/packages/contracts/AgoreumSubscriptions.abi.json
    networks:
      - internal
    healthcheck:
      disable: true
    command: >
      sh -c "if [ -n \"$$SUBSCRIPTIONS_CONTRACT_ADDRESS\" ]; then
      python -m app.cli index-subscriptions --follow --interval 15;
      else echo 'subscriptions contract not configured; idling'; sleep infinity; fi"
    deploy:
      resources:
        limits:
          memory: 384M
    logging: *logging

  # Webhook delivery worker. Drains the outbox the API writes when events fire,
  # signs each payload, and POSTs it to subscribers, retrying failures. Single
  # instance by design, reusing the API image with a different entrypoint. It
  # sends nothing outbound unless WEBHOOK_DELIVERY_ENABLED is set in .env; until
  # then it records due deliveries as suppressed rather than contacting anyone.
  webhooks:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: always
    depends_on:
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      APP_ENV: production
      DEBUG: "false"
      REDIS_URL: redis://redis:6379/0
      CONTRACT_ABI_PATH: /srv/packages/contracts/AgoreumEscrow.abi.json
    networks:
      - internal
    healthcheck:
      disable: true
    command: >
      python -m app.cli deliver-webhooks --follow --interval 5
    deploy:
      resources:
        limits:
          memory: 384M
    logging: *logging

  # Self-hosted, cookieless analytics. Served under /insights via nginx so the
  # tracker is same-origin, and pointed at a dedicated `umami` database on the
  # managed cluster (no extra database container to run or back up).
  umami:
    image: ghcr.io/umami-software/umami:postgresql-latest
    restart: always
    env_file:
      - .env
    environment:
      DATABASE_TYPE: postgresql
      DATABASE_URL: ${UMAMI_DATABASE_URL}
      APP_SECRET: ${UMAMI_APP_SECRET}
      # The prebuilt image bakes its base path at build time, so BASE_PATH has no
      # effect at runtime; nginx strips /insights instead, and the tracker's
      # data-host-url keeps collection under that path.
      DISABLE_TELEMETRY: "1"
      # The connection to the managed database is encrypted but its DigitalOcean
      # CA is self-signed in-chain, which Prisma rejects by default (the API's
      # asyncpg client only encrypts, it does not verify, so it connects fine).
      # The database is reachable only from this droplet over the private VPC, so
      # matching that posture here, TLS on, chain not verified, is the right
      # trade rather than the connection failing outright.
      NODE_TLS_REJECT_UNAUTHORIZED: "0"
    expose:
      - "3000"
    networks:
      - internal
    deploy:
      resources:
        limits:
          memory: 320M
    logging: *logging

  # Uptime + error monitor. Checks the public site, the API's dependency health,
  # and indexer freshness, and alerts to Telegram on state changes. Stdlib-only
  # script on a stock image, so there is nothing to build. It stays silent until
  # TELEGRAM_CHAT_ID is set, so it is safe to run before that is wired.
  monitor:
    image: python:3.12-slim
    restart: always
    env_file:
      - .env
    environment:
      MONITOR_SITE_URL: https://agoreum.xyz/en
      MONITOR_API_BASE: http://api:8000/api/v1
      MONITOR_INTERVAL: "60"
    volumes:
      - ./scripts/monitor.py:/monitor.py:ro
    command: ["python", "/monitor.py"]
    networks:
      - internal
    depends_on:
      - api
    deploy:
      resources:
        limits:
          memory: 96M
    logging: *logging

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-https://agoreum.xyz}
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://agoreum.xyz}
        NEXT_PUBLIC_CHAIN_ID: ${NEXT_PUBLIC_CHAIN_ID:-8453}
        NEXT_PUBLIC_WALLETCONNECT_PROJECT_ID: ${NEXT_PUBLIC_WALLETCONNECT_PROJECT_ID:-}
        NEXT_PUBLIC_BASE_RPC_URL: ${NEXT_PUBLIC_BASE_RPC_URL:-}
        NEXT_PUBLIC_BASE_SEPOLIA_RPC_URL: ${NEXT_PUBLIC_BASE_SEPOLIA_RPC_URL:-}
        NEXT_PUBLIC_UMAMI_URL: ${NEXT_PUBLIC_UMAMI_URL:-/insights}
        NEXT_PUBLIC_UMAMI_WEBSITE_ID: ${NEXT_PUBLIC_UMAMI_WEBSITE_ID:-}
    restart: always
    depends_on:
      api:
        condition: service_healthy
    environment:
      NODE_ENV: production
      # Server-rendered pages reach the API over the internal network, so that
      # traffic never leaves the host or passes through Cloudflare.
      NEXT_PUBLIC_API_URL: http://api:8000
    expose:
      - "3000"
    networks:
      - internal
    healthcheck:
      # Checks that *this* process serves, by hitting its own root (a 307 to the
      # locale). It deliberately does NOT probe the API through the public URL:
      # that made web report unhealthy whenever the edge had any hiccup, even
      # though web itself was fine. The slim Node runtime has no curl/wget, so the
      # probe uses Node's built-in fetch.
      test:
        - "CMD"
        - "node"
        - "-e"
        - "fetch('http://127.0.0.1:3000/',{redirect:'manual'}).then(r=>process.exit(r.status<500?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 768M
    logging: *logging

  nginx:
    image: nginx:1.27-alpine
    restart: always
    depends_on:
      - api
      - web
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infra/nginx/agoreum.conf:/etc/nginx/conf.d/default.conf:ro
      # agoreum.conf includes this from each proxied location; it must be present
      # in the container or nginx refuses to start.
      - ./infra/nginx/proxy_headers.conf:/etc/nginx/conf.d/proxy_headers.conf:ro
      # Cloudflare Origin certificates, provisioned on the host.
      - ./infra/nginx/certs:/etc/nginx/certs:ro
      - nginx_cache:/var/cache/nginx
    networks:
      - internal
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 256M
    logging: *logging

networks:
  internal:
    driver: bridge

volumes:
  nginx_cache:

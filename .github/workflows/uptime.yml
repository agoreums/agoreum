name: Uptime

# Watches the public site from outside the droplet.
#
# The on-droplet monitor cannot report that the droplet is gone, because it goes
# down with it. A reboot drill confirmed that: it sent nothing during the outage
# and only reported a problem once it was already back. This runs on GitHub's
# infrastructure, which shares no failure mode with the host being watched.
#
# This is the secondary. `infra/uptime-worker` runs the same probes on
# Cloudflare's cron every minute and is the primary; this exists so that a fault
# in Cloudflare's scheduler, or in that Worker, still leaves the site watched by
# something on unrelated infrastructure.
#
# Half-hourly, and that is honest rather than a downgrade. This asked for every
# five minutes and GitHub delivered roughly one run per hundred minutes, because
# high-frequency schedules are queued at low priority and dropped under load.
# Declaring a cadence the platform will not honour makes the file lie about its
# own coverage, and a backup checked every thirty minutes is what this actually
# was. Asking for less should also see it throttled less.
on:
  schedule:
    - cron: '*/30 * * * *'
  # So the check can be exercised on demand rather than only on the schedule.
  workflow_dispatch:

concurrency:
  group: uptime
  cancel-in-progress: false

permissions:
  contents: read
  # To read whether the previous run failed, which decides if an all-clear is owed.
  actions: read

jobs:
  check:
    name: Check
    runs-on: ubuntu-24.04
    # Scheduled workflows would otherwise run in forks of a public repo, where
    # the secrets do not exist and every run would report a false failure.
    if: github.repository == 'agoreums/agoreum'
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts
      - name: Probe the public site and API
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GH_TOKEN: ${{ github.token }}
        working-directory: .github/scripts
        run: python3 uptime_check.py

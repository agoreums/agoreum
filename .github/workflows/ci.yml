name: CI

# Runs on every push and pull request to main. Jobs are split by concern so a
# failure names what broke rather than "the build".
on:
  push:
    branches: [main]
    # A push whose files are all documentation neither needs the test matrix nor
    # a production redeploy: the running site serves none of these files, so a
    # recreate would only cost a brief blip for nothing. GitHub skips the run only
    # when every changed path matches, so a single code file still runs the full
    # suite and deploys. The workflow file itself is not matched here, so changes
    # to CI always run.
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'LICENSE'
  pull_request:
    branches: [main]
  workflow_dispatch:

# A newer push supersedes an in-flight run for the same ref. Without this, a
# branch pushed three times queues three full matrices.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Read-only by default. A workflow that cannot write cannot be turned into a
# supply-chain foothold by a malicious dependency.
permissions:
  contents: read

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-24.04

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: agoreum
          POSTGRES_PASSWORD: ci_only_not_a_real_secret
          POSTGRES_DB: agoreum_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U agoreum -d agoreum_test"
          --health-interval 5s --health-timeout 5s --health-retries 10

      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10

    env:
      # CI-only values. The real .env is never available to a workflow, and no
      # test needs a live credential.
      DATABASE_URL: postgresql+asyncpg://agoreum:ci_only_not_a_real_secret@localhost:5432/agoreum_test
      DATABASE_URL_SYNC: postgresql+psycopg://agoreum:ci_only_not_a_real_secret@localhost:5432/agoreum_test
      REDIS_URL: redis://localhost:6379/0
      JWT_SECRET: ci_only_jwt_secret_not_used_anywhere_else_32b
      APP_ENV: test
      SIWE_DOMAIN: localhost:3000
      APP_URL: http://localhost:3000
      # Disabled so hundreds of CI sign-ins do not throttle the run; the
      # security suite turns it back on for the tests that need it.
      RATE_LIMIT_ENABLED: "false"
      # Guarantees no CI run can put a message in a real inbox.
      EMAIL_SENDING_ENABLED: "false"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        working-directory: apps/api
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        working-directory: apps/api
        run: ruff check .

      - name: Apply migrations
        working-directory: apps/api
        run: alembic upgrade head

      - name: Verify migrations are reversible
        working-directory: apps/api
        # A migration that cannot be rolled back is a migration that cannot be
        # safely deployed. Autogenerate does not drop enum types, so this has
        # caught a real defect before.
        run: |
          alembic downgrade base
          alembic upgrade head

      - name: Verify models match migrations
        working-directory: apps/api
        # Fails if someone changed a model without generating a migration.
        run: alembic check

      - name: Seed reference data
        working-directory: apps/api
        run: python -m app.cli seed

      - name: Test
        working-directory: apps/api
        run: pytest -q

  frontend:
    name: Frontend
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        working-directory: apps/web
        # `ci` fails on a lockfile mismatch rather than silently resolving a
        # different tree.
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        working-directory: apps/web
        run: npm run typecheck

      - name: Lint
        working-directory: apps/web
        run: npm run lint

      - name: Test
        working-directory: apps/web
        # Includes the catalogue parity check, so a missing translation fails
        # here rather than reaching a user.
        run: npm test

      - name: Build
        working-directory: apps/web
        run: npm run build

  contracts:
    name: Contracts
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Check formatting
        working-directory: contracts
        run: forge fmt --check

      - name: Build
        working-directory: contracts
        run: forge build --sizes

      - name: Test
        working-directory: contracts
        run: forge test -vv

      - name: Verify the exported ABI is current
        # The ABI is committed and consumed by both the backend and the
        # frontend. If it has drifted from the contracts, one side is decoding a
        # shape the other no longer emits.
        run: |
          python scripts/sync_abi.py
          git diff --exit-code -- packages/contracts apps/web/src/lib/escrow-abi.ts \
            || (echo "::error::Exported ABI is stale. Run scripts/sync_abi.py and commit." && exit 1)

  # The official client SDKs. They are independent artifacts, so they gate pull
  # requests and keep main green, but deliberately do not gate the deploy job
  # below: an SDK regression must never hold back an application release.
  sdk-python:
    name: Python SDK
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        working-directory: sdks/python
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        working-directory: sdks/python
        run: ruff check .

      - name: Types
        working-directory: sdks/python
        run: mypy src

      - name: Test
        working-directory: sdks/python
        run: pytest -q

  sdk-typescript:
    name: TypeScript SDK
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: sdks/typescript/package-lock.json

      - name: Install
        working-directory: sdks/typescript
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        working-directory: sdks/typescript
        run: npm run typecheck

      - name: Test
        working-directory: sdks/typescript
        run: npm test

      - name: Build
        working-directory: sdks/typescript
        run: npm run build

  sdk-go:
    name: Go SDK
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          # Pins to the module's declared minimum; no go.sum since the SDK has no
          # dependencies, so module caching is turned off rather than left to hash
          # a file that does not exist.
          go-version-file: sdks/go/go.mod
          cache: false

      - name: Formatting
        working-directory: sdks/go
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt needed on: $unformatted"
            exit 1
          fi

      - name: Vet
        working-directory: sdks/go
        run: go vet ./...

      - name: Test
        working-directory: sdks/go
        run: go test ./...

  secrets:
    name: Secret scan
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: a secret removed in a later commit is still exposed in
          # the one that introduced it.
          fetch-depth: 0

      - name: Scan history for credentials
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Confirm no environment file is tracked
        run: |
          if git ls-files --error-unmatch .env >/dev/null 2>&1; then
            echo "::error::.env is tracked by git"
            exit 1
          fi
          tracked=$(git ls-files | grep -E '(^|/)\.env($|\.)' | grep -v '\.example$' || true)
          if [ -n "$tracked" ]; then
            echo "::error::environment files are tracked: $tracked"
            exit 1
          fi
          echo "No environment files tracked."

  nginx:
    name: Nginx config
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      # deploy.sh reloads nginx and, if the reload fails, recreates the
      # container. An invalid config therefore does not fail safe: it takes the
      # site down. `nginx -t` in the same image the droplet runs catches that
      # here instead, where the only cost is a red build.
      - name: Validate the nginx configuration
        run: |
          docker run --rm \
            -v "$PWD/infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro" \
            -v "$PWD/infra/nginx/agoreum.conf:/etc/nginx/conf.d/default.conf:ro" \
            -v "$PWD/infra/nginx/proxy_headers.conf:/etc/nginx/conf.d/proxy_headers.conf:ro" \
            -v "$PWD/infra/nginx/cloudflare_realip.conf:/etc/nginx/conf.d/cloudflare_realip.conf:ro" \
            nginx:1.27-alpine nginx -t

      # The origin trusts CF-Connecting-IP as the client identity, so it must be
      # a value nginx sets, never one forwarded from the request. Forwarding
      # $http_cf_connecting_ip is only safe while every request arrives through
      # Cloudflare, which no firewall rule in this repo guarantees.
      - name: Reject a client-controlled CF-Connecting-IP
        run: |
          if grep -q 'CF-Connecting-IP  *\$http_cf_connecting_ip' infra/nginx/proxy_headers.conf; then
            echo "::error::CF-Connecting-IP is forwarded from the client and can be forged"
            exit 1
          fi
          if ! grep -q 'set_real_ip_from' infra/nginx/cloudflare_realip.conf; then
            echo "::error::no set_real_ip_from ranges, real client IP cannot be trusted"
            exit 1
          fi
          echo "CF-Connecting-IP is set by nginx from a verified peer."

  docker:
    name: Container builds
    runs-on: ubuntu-24.04
    # Only worth the minutes once the code itself is known good.
    needs: [backend, frontend]

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          # Built and validated, never pushed from CI. Deployment is a separate,
          # deliberate action.
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: false
          build-args: |
            NEXT_PUBLIC_APP_URL=https://agoreum.xyz
            NEXT_PUBLIC_API_URL=https://agoreum.xyz
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Continuous deployment. Runs only on a real merge to main, and only once every
  # job that could catch a problem has passed. The droplet's authorized key forces
  # this connection to pull main and run scripts/deploy.sh, nothing else, so a
  # leaked CI key cannot be used for arbitrary shell access. The deploy script
  # verifies the API comes back healthy and exits non-zero otherwise, so a broken
  # release fails the pipeline rather than silently going live.
  deploy:
    name: Deploy
    runs-on: ubuntu-24.04
    needs: [backend, frontend, contracts, secrets, docker, nginx]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - name: Deploy to the droplet
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null
          # The command sent here is ignored: the droplet key forces the deploy.
          ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes \
            root@"${{ secrets.DEPLOY_HOST }}" deploy

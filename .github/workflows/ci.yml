name: CI

# Runs on every push and pull request to main. Jobs are split by concern so a
# failure names what broke rather than "the build".
on:
  push:
    branches: [main]
    # A push whose files are all documentation neither needs the test matrix nor
    # a production redeploy: the running site serves none of these files, so a
    # recreate would only cost a brief blip for nothing. GitHub skips the run only
    # when every changed path matches, so a single code file still runs the full
    # suite and deploys. The workflow file itself is not matched here, so changes
    # to CI always run.
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'LICENSE'
  pull_request:
    branches: [main]
  workflow_dispatch:

# A newer push supersedes an in-flight run for the same ref. Without this, a
# branch pushed three times queues three full matrices.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Read-only by default. A workflow that cannot write cannot be turned into a
# supply-chain foothold by a malicious dependency.
permissions:
  contents: read

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-24.04
    # A test that waits on a database lock waits forever, and the default job
    # limit is six hours. One such run burned 107 minutes before anyone noticed.
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: agoreum
          POSTGRES_PASSWORD: ci_only_not_a_real_secret
          POSTGRES_DB: agoreum_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U agoreum -d agoreum_test"
          --health-interval 5s --health-timeout 5s --health-retries 10

      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10

    env:
      # CI-only values. The real .env is never available to a workflow, and no
      # test needs a live credential.
      DATABASE_URL: postgresql+asyncpg://agoreum:ci_only_not_a_real_secret@localhost:5432/agoreum_test
      DATABASE_URL_SYNC: postgresql+psycopg://agoreum:ci_only_not_a_real_secret@localhost:5432/agoreum_test
      REDIS_URL: redis://localhost:6379/0
      JWT_SECRET: ci_only_jwt_secret_not_used_anywhere_else_32b
      APP_ENV: test
      SIWE_DOMAIN: localhost:3000
      APP_URL: http://localhost:3000
      # Disabled so hundreds of CI sign-ins do not throttle the run; the
      # security suite turns it back on for the tests that need it.
      RATE_LIMIT_ENABLED: "false"
      # Guarantees no CI run can put a message in a real inbox.
      EMAIL_SENDING_ENABLED: "false"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        working-directory: apps/api
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        working-directory: apps/api
        run: ruff check .

      # The chain client's live behaviour, reading receipts, counting
      # confirmations and checking a block is still canonical, is what the
      # indexer stands on, and a stalled indexer is the failure this project
      # treats as most costly because it is silent. Those tests need a real node
      # and a fixture built by deploying to it, and the fixture is generated
      # rather than committed, so in CI both conditions failed and every one of
      # them skipped. They were the whole of the suite's remaining skips.
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Start Anvil and build the chain fixture
        run: |
          anvil --port 8545 --chain-id 31337 --silent &
          for i in $(seq 1 30); do
            if curl -s -X POST http://127.0.0.1:8545 \
                 -H 'Content-Type: application/json' \
                 -d '{"jsonrpc":"2.0","id":1,"method":"eth_chainId","params":[]}' \
                 | grep -q result; then
              echo "anvil up after ${i}s"; break
            fi
            sleep 1
          done
          python scripts/anvil_fixture.py
          test -s apps/api/tests/anvil_fixture.json

      - name: Apply migrations
        working-directory: apps/api
        run: alembic upgrade head

      - name: Verify migrations are reversible
        working-directory: apps/api
        # A migration that cannot be rolled back is a migration that cannot be
        # safely deployed. Autogenerate does not drop enum types, so this has
        # caught a real defect before.
        run: |
          alembic downgrade base
          alembic upgrade head

      - name: Verify models match migrations
        working-directory: apps/api
        # Fails if someone changed a model without generating a migration.
        run: alembic check

      - name: Seed reference data
        working-directory: apps/api
        run: python -m app.cli seed

      - name: Test, and no test may skip
        working-directory: apps/api
        # The timeout: the whole suite runs in about a minute, so any single test
        # over 60 seconds is stuck rather than slow. Without it a blocked test
        # hangs the job silently and the log never says which one it was.
        #
        # The skip assertion: a test that skips is not a test that passes, and a
        # skipped test still exits zero, so a dependency quietly disappearing
        # shrinks the suite without turning anything red. This used to guard the
        # chain tests only, which left every other skippable test unwatched. It
        # now covers the whole suite, and `-rs` makes the log name each skip and
        # its reason rather than leaving an `s` in a row of dots.
        #
        # Run without `-q` on purpose. Under `-q` this pytest prints no final
        # counts line at all, so "N passed" cannot be read back out of the log
        # and any check looking for it would pass by never matching.
        run: |
          set -o pipefail
          pytest --timeout=60 -rs 2>&1 | tee /tmp/api-tests.txt
          if grep -qE "^SKIPPED" /tmp/api-tests.txt; then
            echo "::error::Tests skipped rather than ran. A dependency is missing, so whatever those tests cover is unverified."
            grep -E "^SKIPPED" /tmp/api-tests.txt
            exit 1
          fi

  frontend:
    name: Frontend
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        working-directory: apps/web
        # `ci` fails on a lockfile mismatch rather than silently resolving a
        # different tree.
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        working-directory: apps/web
        run: npm run typecheck

      - name: Lint
        working-directory: apps/web
        run: npm run lint

      - name: Test
        working-directory: apps/web
        # Includes the catalogue parity check, so a missing translation fails
        # here rather than reaching a user.
        run: npm test

      - name: Build
        working-directory: apps/web
        run: npm run build

  contracts:
    name: Contracts
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Check formatting
        working-directory: contracts
        run: forge fmt --check

      - name: Build
        working-directory: contracts
        run: forge build --sizes

      - name: Test
        working-directory: contracts
        run: forge test -vv

      - name: Verify the exported ABI is current
        # The ABI is committed and consumed by both the backend and the
        # frontend. If it has drifted from the contracts, one side is decoding a
        # shape the other no longer emits.
        run: |
          python scripts/sync_abi.py
          git diff --exit-code -- packages/contracts apps/web/src/lib/escrow-abi.ts \
            || (echo "::error::Exported ABI is stale. Run scripts/sync_abi.py and commit." && exit 1)

  # The fork suite runs the escrow against the real USDC contract on a Base
  # mainnet fork: blacklist scenarios, the global pause, and a full flow. The
  # incident runbook cites these tests by name as its coverage, and until this
  # job existed they only ran when somebody remembered to run them locally with
  # an RPC URL, which is a test that skips wearing the label of one that passes.
  # Read-only: a fork test fetches state, it never sends a transaction.
  #
  # Deliberately not in the deploy job's needs. It depends on a third party, and
  # an Alchemy outage must not block a release. It is in the notifier's needs,
  # so a real failure still reaches the operator channel.
  fork:
    name: Fork tests
    runs-on: ubuntu-24.04
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Run the fork suite against real USDC
        working-directory: contracts
        env:
          ALCHEMY_BASE_URL_MAINNET: ${{ secrets.ALCHEMY_BASE_URL_MAINNET }}
        run: |
          forge test --match-path "test/AgoreumEscrow.fork.t.sol" -vv
          # Six tests exist. Guard against the silent-skip failure mode this job
          # was created to close: if the secret stops resolving, forge reports
          # skips and exits zero, and this job would go green while checking
          # nothing.
          forge test --match-path "test/AgoreumEscrow.fork.t.sol" --json 2>/dev/null \
            | python3 -c "
          import json,sys
          data = json.load(sys.stdin)
          results = [t for f in data.values() for t in f.get('test_results', {}).values()]
          passed = sum(1 for t in results if t.get('status') == 'Success')
          skipped = sum(1 for t in results if t.get('status') == 'Skipped')
          print(f'{passed} passed, {skipped} skipped of {len(results)}')
          sys.exit(0 if passed == 6 and skipped == 0 else 1)
          "

  # The official client SDKs. They are independent artifacts, so they gate pull
  # requests and keep main green, but deliberately do not gate the deploy job
  # below: an SDK regression must never hold back an application release.
  sdk-python:
    name: Python SDK
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        working-directory: sdks/python
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        working-directory: sdks/python
        run: ruff check .

      - name: Types
        working-directory: sdks/python
        run: mypy src

      - name: Test
        working-directory: sdks/python
        run: pytest -q

  sdk-typescript:
    name: TypeScript SDK
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: sdks/typescript/package-lock.json

      - name: Install
        working-directory: sdks/typescript
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        working-directory: sdks/typescript
        run: npm run typecheck

      - name: Test
        working-directory: sdks/typescript
        run: npm test

      - name: Build
        working-directory: sdks/typescript
        run: npm run build

  sdk-go:
    name: Go SDK
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          # Pins to the module's declared minimum; no go.sum since the SDK has no
          # dependencies, so module caching is turned off rather than left to hash
          # a file that does not exist.
          go-version-file: sdks/go/go.mod
          cache: false

      - name: Formatting
        working-directory: sdks/go
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt needed on: $unformatted"
            exit 1
          fi

      - name: Vet
        working-directory: sdks/go
        run: go vet ./...

      - name: Test
        working-directory: sdks/go
        run: go test ./...

  secrets:
    name: Secret scan
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: a secret removed in a later commit is still exposed in
          # the one that introduced it.
          fetch-depth: 0

      - name: Scan history for credentials
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Confirm no environment file is tracked
        run: |
          if git ls-files --error-unmatch .env >/dev/null 2>&1; then
            echo "::error::.env is tracked by git"
            exit 1
          fi
          tracked=$(git ls-files | grep -E '(^|/)\.env($|\.)' | grep -v '\.example$' || true)
          if [ -n "$tracked" ]; then
            echo "::error::environment files are tracked: $tracked"
            exit 1
          fi
          echo "No environment files tracked."

  # Dependency advisories. Its own job rather than a step inside backend or
  # frontend, because a newly published advisory is not a regression in the
  # commit that happens to be pushed that day and must not block a release. It
  # reports; a human decides. Both `npm ci` calls pass --no-audit deliberately,
  # so without this nothing looked at advisories at all: the postcss and sharp
  # findings sat unnoticed until an audit went looking by hand.
  audit:
    name: Dependency audit
    runs-on: ubuntu-24.04
    # Advisory only. Never gates the deploy.
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Audit web dependencies
        working-directory: apps/web
        run: |
          npm ci --no-audit --no-fund
          npm audit --audit-level=high || true
          echo "--- machine readable counts ---"
          npm audit --json 2>/dev/null             | python -c "import sys,json; v=json.load(sys.stdin)['metadata']['vulnerabilities']; print(v)"             || echo "no audit summary available"

      - name: Audit API dependencies
        working-directory: apps/api
        # Resolves from pyproject the same way the production image does, rather
        # than auditing a developer virtualenv that ships nowhere.
        run: |
          python -m pip install --upgrade pip pip-audit
          pip install -e .
          pip-audit --progress-spinner off || true

  # A service can drift out of the deploy path in two ways, both silent at deploy
  # time and both of which have caused incidents here: an image that is never
  # rebuilt, and a bind-mounted file whose container is never recreated.
  compose:
    name: Deploy coverage
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4
      - run: pip install pyyaml
      - name: Every compose service must be reachable by the deploy script
        run: python scripts/check_deploy_coverage.py

  nginx:
    name: Nginx config
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      # deploy.sh reloads nginx and, if the reload fails, recreates the
      # container. An invalid config therefore does not fail safe: it takes the
      # site down. `nginx -t` in the same image the droplet runs catches that
      # here instead, where the only cost is a red build.
      - name: Validate the nginx configuration
        run: |
          # nginx -t resolves upstream hostnames and opens the TLS certificate
          # while parsing, so a bare run fails on "host not found in upstream"
          # and on the missing origin certificate rather than on anything about
          # the config itself. Both are supplied here so the test exercises the
          # directives and nothing else. The certificate is a throwaway
          # generated in this step; the real one is provisioned on the droplet
          # and is not in the repository.
          certs="$(mktemp -d)"
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 \
            -keyout "$certs/origin.key" -out "$certs/origin.pem" \
            -subj "/CN=agoreum.xyz" 2>/dev/null
          docker run --rm \
            --add-host api:127.0.0.1 \
            --add-host web:127.0.0.1 \
            -v "$PWD/infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro" \
            -v "$PWD/infra/nginx/agoreum.conf:/etc/nginx/conf.d/default.conf:ro" \
            -v "$PWD/infra/nginx/proxy_headers.conf:/etc/nginx/conf.d/proxy_headers.conf:ro" \
            -v "$PWD/infra/nginx/cloudflare_realip.conf:/etc/nginx/conf.d/cloudflare_realip.conf:ro" \
            -v "$certs:/etc/nginx/certs:ro" \
            nginx:1.27-alpine nginx -t

      # The origin trusts CF-Connecting-IP as the client identity, so it must be
      # a value nginx sets, never one forwarded from the request. Forwarding
      # $http_cf_connecting_ip is only safe while every request arrives through
      # Cloudflare, which no firewall rule in this repo guarantees.
      - name: Reject a client-controlled CF-Connecting-IP
        run: |
          if grep -q 'CF-Connecting-IP  *\$http_cf_connecting_ip' infra/nginx/proxy_headers.conf; then
            echo "::error::CF-Connecting-IP is forwarded from the client and can be forged"
            exit 1
          fi
          if ! grep -q 'set_real_ip_from' infra/nginx/cloudflare_realip.conf; then
            echo "::error::no set_real_ip_from ranges, real client IP cannot be trusted"
            exit 1
          fi
          echo "CF-Connecting-IP is set by nginx from a verified peer."

  docker:
    name: Container builds
    runs-on: ubuntu-24.04
    # Only worth the minutes once the code itself is known good.
    needs: [backend, frontend]

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          # Built and validated, never pushed from CI. Deployment is a separate,
          # deliberate action.
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: false
          load: true
          tags: agoreum-web:ci
          build-args: |
            NEXT_PUBLIC_APP_URL=https://agoreum.xyz
            NEXT_PUBLIC_API_URL=https://agoreum.xyz
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # A build can install the right dependencies and still ship the wrong ones.
      # This shipped Next 16.2.11 for two weeks from a lockfile pinning 16.3.0,
      # because a stale node_modules on the build host was copied over the
      # installed tree, so a bump that cleared three high advisories never
      # reached production. Nothing failed, nothing warned. This compares what is
      # actually inside the image against the lockfile.
      - name: The image must contain the dependencies the lockfile pins
        run: |
          set -euo pipefail
          expected=$(node -p "require('./apps/web/package-lock.json').packages['node_modules/next'].version")
          actual=$(docker run --rm --entrypoint node agoreum-web:ci \
            -p "require('/srv/app/node_modules/next/package.json').version")
          echo "lockfile pins next $expected, image contains $actual"
          if [ "$expected" != "$actual" ]; then
            echo "::error::Image ships next $actual but the lockfile pins $expected."
            exit 1
          fi

  # Continuous deployment. Runs only on a real merge to main, and only once every
  # job that could catch a problem has passed. The droplet's authorized key forces
  # this connection to pull main and run scripts/deploy.sh, nothing else, so a
  # leaked CI key cannot be used for arbitrary shell access. The deploy script
  # verifies the API comes back healthy and exits non-zero otherwise, so a broken
  # release fails the pipeline rather than silently going live.
  deploy:
    name: Deploy
    runs-on: ubuntu-24.04
    needs: [backend, frontend, contracts, secrets, docker, nginx, compose]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - name: Deploy to the droplet
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null
          # The command sent here is ignored: the droplet key forces the deploy.
          ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes \
            root@"${{ secrets.DEPLOY_HOST }}" deploy

  # A red tick on a page nobody has open is not a notification. The contracts job
  # failed its formatting check across two commits while everything else passed,
  # and that was found by going to look. This sends the outcome to the same
  # Telegram channel the uptime monitor uses.
  notify:
    name: Notify
    runs-on: ubuntu-24.04
    needs:
      [backend, frontend, contracts, fork, sdk-python, sdk-typescript, sdk-go,
       secrets, audit, nginx, compose, docker, deploy]
    # always(), so it reports whatever the other jobs did rather than being
    # skipped by their failure. Restricted to pushes on main because a fork pull
    # request cannot read the secrets anyway, and a contributor already sees
    # their own red tick without an operator being paged about it.
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      # To read whether the previous run failed, which is what decides if a
      # success is worth reporting.
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts
      - name: Report the outcome to the operator channel
        # A broken notifier must be visible without turning a green build red.
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GH_TOKEN: ${{ github.token }}
          NEEDS: ${{ toJSON(needs) }}
        working-directory: .github/scripts
        run: python3 notify_ci.py

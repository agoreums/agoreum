[project]
name = "agoreum-api"
version = "0.1.0"
description = "Agoreum — Autonomous Agent Commerce Hub API"
requires-python = ">=3.12"
license = { text = "MIT" }

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "psycopg[binary]>=3.2",
    "alembic>=1.14",
    "redis>=5.2",
    "python-multipart>=0.0.20",
    # Runtime, not optional: SIWE auth, JWTs, on-chain reads, DNS-based domain
    # verification, and the HTTP client the chain layer uses. These were only in
    # the Dockerfile before, so a fresh `pip install` (CI) lacked them and the
    # test suite could not even import — while the built image worked. Declared
    # here so pyproject is the single source of truth for both.
    "eth-account>=0.13",
    "siwe>=4.4",
    "pyjwt[crypto]>=2.9",
    "dnspython>=2.7",
    "httpx>=0.28",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "mypy>=1.13",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["."]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "C4", "SIM", "S", "ASYNC"]
ignore = [
    # Formatter owns line length.
    "E501",
    # FastAPI's dependency-injection idiom *requires* calls in argument defaults
    # (`db: AsyncSession = Depends(get_db)`). The rule does not apply here.
    "B008",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
"app/migrations/*" = ["E402", "F401"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q --strict-markers"

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true
ignore_missing_imports = true

[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"

# Base runs the Cancun instruction set. Pinning both the compiler and the EVM
# version keeps local builds byte-identical to what gets deployed and verified.
solc_version = "0.8.28"
evm_version = "cancun"

optimizer = true
# Escrow calls are made far more often than the contract is deployed, so the
# optimizer is tuned for runtime gas rather than deployment size.
optimizer_runs = 10_000

# Treat warnings as errors. In a contract that holds funds, an unused variable
# or a shadowed declaration is a signal worth stopping for.
deny_warnings = true

via_ir = false
bytecode_hash = "none"
cbor_metadata = false

remappings = [
    "forge-std/=lib/forge-std/src/",
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
]

[profile.default.fuzz]
# Failure paths in an escrow deserve more than the default 256 cases.
runs = 2_000
max_test_rejects = 100_000

[profile.default.invariant]
runs = 512
depth = 64
fail_on_revert = false
call_override = false
shrink_run_limit = 5_000

# A heavier profile for pre-deployment verification.
[profile.deep.fuzz]
runs = 50_000

[profile.deep.invariant]
runs = 2_000
depth = 128

[fmt]
line_length = 100
tab_width = 4
bracket_spacing = false
int_types = "long"

[rpc_endpoints]
base_sepolia = "${BASE_SEPOLIA_RPC_URL}"
base = "${BASE_RPC_URL}"

[etherscan]
base_sepolia = {key = "${BASESCAN_API_KEY}", chain = 84532}
base = {key = "${BASESCAN_API_KEY}", chain = 8453}

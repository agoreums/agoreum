[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"

# Base runs the Cancun instruction set. Pinning both the compiler and the EVM
# version keeps local builds byte-identical to what gets deployed and verified.
solc_version = "0.8.36"
evm_version = "cancun"

optimizer = true
# Escrow calls are made far more often than the contract is deployed, so the
# optimizer is tuned for runtime gas rather than deployment size.
optimizer_runs = 10_000

# Treat warnings as errors. In a contract that holds funds, an unused variable
# or a shadowed declaration is a signal worth stopping for.
deny_warnings = true

# ...but only for code we own. forge-std 1.9.6 names several parameters `error`,
# which solc 0.8.36 flags because `error` becomes a keyword in a future release.
# That is the dependency's warning to fix, not ours, and it must not be able to
# stop a build of contracts that are themselves warning-free.
ignored_warnings_from = ["lib"]

# 4591 is solc's own "there are more than 256 warnings" notice. It carries no
# source location, so it cannot be attributed to `lib` and slips past the filter
# above even though every warning it is counting comes from forge-std. Ignored
# here for the same reason. Individual warnings in our own code are still fatal.
ignored_error_codes = [4591]

via_ir = false
bytecode_hash = "none"
cbor_metadata = false

remappings = [
    "forge-std/=lib/forge-std/src/",
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
]

[profile.default.fuzz]
# Failure paths in an escrow deserve more than the default 256 cases.
runs = 2_000
max_test_rejects = 100_000

[profile.default.invariant]
runs = 512
depth = 64
fail_on_revert = false
call_override = false
shrink_run_limit = 5_000

# A heavier profile for pre-deployment verification.
[profile.deep.fuzz]
runs = 50_000

[profile.deep.invariant]
runs = 2_000
depth = 128

[fmt]
line_length = 100
tab_width = 4
bracket_spacing = false
int_types = "long"

# Point at the variable names that actually exist in .env. These previously read
# BASE_SEPOLIA_RPC_URL and BASE_RPC_URL, which are defined nowhere in the repo or
# the environment, so `--rpc-url base` expanded to an empty string and the
# documented deploy command could not work.
#
# Foundry reads .env from the directory it runs in, and this repo keeps its .env
# at the root, one level above contracts/. Running `forge script` from contracts/
# therefore does NOT pick it up: the alias expands to nothing and the error says
# "environment variable not found" rather than anything about paths. Either run
# forge from the repo root, or export the variable for that one command.
[rpc_endpoints]
base_sepolia = "${ALCHEMY_BASE_URL_SEPOLIA}"
base = "${ALCHEMY_BASE_URL_MAINNET}"

[etherscan]
base_sepolia = {key = "${BASESCAN_API_KEY}", chain = 84532}
base = {key = "${BASESCAN_API_KEY}", chain = 8453}
